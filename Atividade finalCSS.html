<head>

    <h1>PÁGINA TESTE CSS</h1>

    <h1>Exemplo de Cores no CSS</h1><br>
    <h3 style="background-color: aqua;">Exemplo de texto com cor de fundo</h3>
    <hr>
    <h3 style="color:rgb(252, 59, 252);">Exemplo de texto com mudança da cor da fonte</h3>
